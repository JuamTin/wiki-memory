[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-memoria"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.10",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.6.0",
    "pyyaml>=6.0",
    "tomlkit>=0.15.3",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
wiki-memoria = "wiki_memoria.cli.main:main"
wiki-memoria-hook = "wiki_memoria.cli.hook_entry:main"

[tool.setuptools.packages.find]
where = ["src"]
